name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PANEL_GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend-3xui/package-lock.json

      - name: Build frontend
        run: |
          cd frontend-3xui
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.24.0 --locked

      - name: Verify tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml v${version}"
            exit 1
          }

      - name: Build release binary
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl

      - name: Package release
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/xray-panel-rs
          strip "$bin"
          mkdir -p dist/xray-panel-rs-linux-amd64-lumen
          cp "$bin" dist/xray-panel-rs-linux-amd64-lumen/xray-panel-rs
          cp README.md deploy/install.sh deploy/xray-panel.service deploy/xray-panel.env.example dist/xray-panel-rs-linux-amd64-lumen/
          (cd dist/xray-panel-rs-linux-amd64-lumen && sha256sum xray-panel-rs > SHA256SUMS)
          tar -czf dist/xray-panel-rs-linux-amd64-lumen.tar.gz -C dist xray-panel-rs-linux-amd64-lumen
          cp "$bin" dist/xray-panel-rs
          cp dist/xray-panel-rs-linux-amd64-lumen/SHA256SUMS dist/SHA256SUMS
          file "$bin"
          cat dist/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/xray-panel-rs-linux-amd64-lumen.tar.gz
            dist/xray-panel-rs
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ## 一键安装（Linux x86_64，需 root）

            ```sh
            curl -fsSL https://raw.githubusercontent.com/ztoofar/xray-panel-rs/main/install.sh | sudo bash
            ```

            脚本会下载本 Release、校验 SHA256、安装面板，并在缺少 Xray 时安装官方核心。

            ## 在线更新

            登录面板 → 设置 → 面板更新 → 检查更新。面板从 Releases 下载并校验二进制，
            原子替换后由 systemd 自动重启。

            ## 资产

            - `xray-panel-rs-linux-amd64-lumen.tar.gz`：完整安装包
            - `xray-panel-rs`：原始 Linux amd64 二进制（在线更新使用）
            - `SHA256SUMS`：二进制校验和

