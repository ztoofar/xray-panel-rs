name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PANEL_GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend-3xui/package-lock.json

      - name: Build frontend
        run: |
          cd frontend-3xui
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.24.0 --locked

      - name: Verify tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml v${version}"
            exit 1
          }

      - name: Build release binary
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl

      - name: Package release
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/xray-panel-rs
          strip "$bin"
          mkdir -p dist/xray-panel-rs-linux-amd64-lumen
          cp "$bin" dist/xray-panel-rs-linux-amd64-lumen/xray-panel-rs
          cp README.md deploy/install.sh deploy/xray-panel.service deploy/xray-panel.env.example dist/xray-panel-rs-linux-amd64-lumen/
          chmod +x dist/xray-panel-rs-linux-amd64-lumen/install.sh
          (cd dist/xray-panel-rs-linux-amd64-lumen && sha256sum xray-panel-rs > SHA256SUMS)
          tar -czf dist/xray-panel-rs-linux-amd64-lumen.tar.gz -C dist xray-panel-rs-linux-amd64-lumen
          file "$bin"
          cat dist/xray-panel-rs-linux-amd64-lumen/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/xray-panel-rs-linux-amd64-lumen.tar.gz
          body: |
            ## 更新内容

            - 客户端详情新增月度流量：默认显示本月，并提供历史月份下拉；按
              UTC+8 自然月记录，配额重置和面板重启不会清除已记录的月份
              （升级当月从不完整开始）
            - 新增 `client_traffic_monthly` 表，月度累计与计费在同一 SQLite
              事务内写入；备份/恢复同步包含该表
            - 降低流量/计费热循环开销：缓存轮询间隔与客户端禁用重启设置、
              roster 最多每 10 秒刷新、完全空闲时跳过计费事务、在线心跳
              节流到 10 秒、出站检测设置缓存，减少 2 秒轮询下的重复读写
              与内存 churn

