name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PANEL_GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend-3xui/package-lock.json

      - name: Build frontend
        run: |
          cd frontend-3xui
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.24.0 --locked

      - name: Verify tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml v${version}"
            exit 1
          }

      - name: Build release binary
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl

      - name: Package release
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/xray-panel-rs
          strip "$bin"
          mkdir -p dist/xray-panel-rs-linux-amd64-lumen
          cp "$bin" dist/xray-panel-rs-linux-amd64-lumen/xray-panel-rs
          cp README.md deploy/install.sh deploy/xray-panel.service deploy/xray-panel.env.example dist/xray-panel-rs-linux-amd64-lumen/
          chmod +x dist/xray-panel-rs-linux-amd64-lumen/install.sh
          (cd dist/xray-panel-rs-linux-amd64-lumen && sha256sum xray-panel-rs > SHA256SUMS)
          tar -czf dist/xray-panel-rs-linux-amd64-lumen.tar.gz -C dist xray-panel-rs-linux-amd64-lumen
          file "$bin"
          cat dist/xray-panel-rs-linux-amd64-lumen/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/xray-panel-rs-linux-amd64-lumen.tar.gz
          body: |
            ## 更新内容

            - 新增 Geodata 浏览/校验：浏览 geosite.dat / geoip.dat 的分类与
              条目（分页），校验路由 token（ext:/ext-domain:/ext-site:/
              ext-ip:、`!` 取反、`@attribute`）
            - Geofile 默认存放目录改为 `/usr/local/share/xray`（不存在时创建），
              优先使用 `XRAY_LOCATION_ASSET`
            - 修复 systemd 部署下更新 Geofile 报
              `Read-only file system (os error 30)`：服务单元放行并预先创建
              `/usr/local/share/xray`，下载前先探测目录可写性，错误提示修复方式
            - 新增远端证书 SHA-256 查询：域名解析后固定 IP，经 `xray tls ping`
              获取证书链哈希（含私网目标拦截）
            - 新增内存快照日志：默认每 5 分钟写
              `panel-logs/memory-YYYY-MM-DD.log`，记录 RSS/匿名内存/高水位/
              线程/FD/CPU/大匿名映射与面板容器计数；`PANEL_MEMLOG_SECS`
              可调整间隔（15–3600 秒）或设为 `0` 关闭
            - 删除无后端的前端入口：赞助商、Fail2ban、订阅负载均衡、
              AmneziaWG 就绪、日历续期预览、2FA、备份迁移、未使用的通知 UI
            - 仓库清理：移除早期自研前端 frontend/ 与 memory/、docs/、
              PROGRESS.md、CLAUDE.md 等非源码文件，仓库只保留源代码与脚本

