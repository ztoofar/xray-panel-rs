name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PANEL_GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend-3xui/package-lock.json

      - name: Build frontend
        run: |
          cd frontend-3xui
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.24.0 --locked

      - name: Verify tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml v${version}"
            exit 1
          }

      - name: Build release binary
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl

      - name: Package release
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/xray-panel-rs
          strip "$bin"
          mkdir -p dist/xray-panel-rs-linux-amd64-lumen
          cp "$bin" dist/xray-panel-rs-linux-amd64-lumen/xray-panel-rs
          cp README.md deploy/install.sh deploy/xray-panel.service deploy/xray-panel.env.example dist/xray-panel-rs-linux-amd64-lumen/
          chmod +x dist/xray-panel-rs-linux-amd64-lumen/install.sh
          (cd dist/xray-panel-rs-linux-amd64-lumen && sha256sum xray-panel-rs > SHA256SUMS)
          tar -czf dist/xray-panel-rs-linux-amd64-lumen.tar.gz -C dist xray-panel-rs-linux-amd64-lumen
          file "$bin"
          cat dist/xray-panel-rs-linux-amd64-lumen/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/xray-panel-rs-linux-amd64-lumen.tar.gz
          generate_release_notes: true
          body: |
            ## 一键安装（Linux x86_64，需 root）

            ```sh
            curl -fsSL https://raw.githubusercontent.com/ztoofar/xray-panel-rs/main/install.sh | sudo bash
            ```

            脚本会下载本 Release、校验 SHA256、安装面板，并在缺少 Xray 时安装官方核心。

            ## 代理

            ```sh
            curl -fsSL https://raw.githubusercontent.com/ztoofar/xray-panel-rs/main/install.sh \
              | sudo PANEL_PROXY=http://127.0.0.1:7890 bash
            ```

            支持 HTTP/SOCKS；面板在线更新使用「设置 → 更新代理」的同一地址，
            代理不可达时脚本和面板都会返回包含代理地址的错误。

            ## 在线更新

            登录面板 → 设置 → 面板更新 → 检查更新。面板从 Releases 下载 tar.gz，
            使用 GitHub 资产 digest 校验并解出二进制，原子替换后由 systemd 自动重启。

            ## 资产

            - `xray-panel-rs-linux-amd64-lumen.tar.gz`：完整安装包（含二进制、
              systemd 单元、安装脚本和包内 SHA256SUMS）

            面板在线更新使用 GitHub 为 Release 资产自动计算的 SHA-256 digest，
            不再额外发布校验文件。

