name: update-release-notes

on:
  push:
    branches: [main]
    paths:
      - ".github/release-notes/v0.2.22.md"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update v0.2.22 release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.2.22 --notes-file .github/release-notes/v0.2.22.md
