[package]
name = "xray-panel-rs"
version = "0.2.26"
edition = "2021"
rust-version = "1.85"
description = "Low-memory Xray-core web panel (single node)"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["macros", "json", "multipart", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
hex = "0.4"
http = "1"
libc = "0.2"
mime_guess = "2"
once_cell = "1"
percent-encoding = "2"
prost = "0.13"
rand = "0.8"
rust-embed = "8"
ureq = { version = "3", default-features = false, features = ["rustls", "socks-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "json"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time", "sync", "fs", "io-util"] }
tonic = { version = "0.12", default-features = false, features = ["transport", "prost", "codegen"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
